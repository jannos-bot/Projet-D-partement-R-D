<svg viewBox="0 0 880 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture LoRaWAN : les objets connectés émettent en LoRa RF vers une passerelle, qui relaie en IP vers un network server, qui transmet à l'application server." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4247"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="260" fill="#FFFFFF"/>

  <text x="20" y="18" font-family="ui-sans-serif, Arial" font-size="12" font-weight="600" fill="#565F62">OBJETS CONNECTÉS</text>

  <!-- end devices -->
  <g>
    <rect x="20" y="30" width="70" height="40" rx="6" fill="#EDEEE9" stroke="#3a4247"/>
    <rect x="20" y="100" width="70" height="40" rx="6" fill="#EDEEE9" stroke="#3a4247"/>
    <rect x="20" y="170" width="70" height="40" rx="6" fill="#EDEEE9" stroke="#3a4247"/>
    <text x="55" y="54" text-anchor="middle" font-size="11" fill="#1B1F22">Capteur</text>
    <text x="55" y="124" text-anchor="middle" font-size="11" fill="#1B1F22">Capteur</text>
    <text x="55" y="194" text-anchor="middle" font-size="11" fill="#1B1F22">Capteur</text>
  </g>

  <!-- converging arrows to gateway -->
  <path d="M90,50 Q170,50 210,120" stroke="#2C6E74" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M90,120 L210,120" stroke="#2C6E74" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M90,190 Q170,190 210,120" stroke="#2C6E74" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="11" fill="#2C6E74">LoRa RF</text>

  <!-- gateway -->
  <rect x="215" y="85" width="150" height="70" rx="8" fill="#FFF" stroke="#3a4247" stroke-width="1.6"/>
  <text x="290" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1F22">Passerelle</text>
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#565F62">(Gateway)</text>

  <!-- gateway -> network server -->
  <line x1="365" y1="120" x2="470" y2="120" stroke="#3a4247" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="417" y="105" text-anchor="middle" font-size="10.5" fill="#565F62">IP (Ethernet / 4G / Wi-Fi)</text>

  <!-- network server -->
  <rect x="475" y="85" width="160" height="70" rx="8" fill="#FFF" stroke="#3a4247" stroke-width="1.6"/>
  <text x="555" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1F22">Network</text>
  <text x="555" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1F22">Server</text>

  <!-- network server -> app server -->
  <line x1="635" y1="120" x2="730" y2="120" stroke="#3a4247" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <text x="682" y="105" text-anchor="middle" font-size="10.5" fill="#565F62">API / MQTT</text>

  <!-- app server -->
  <rect x="735" y="85" width="130" height="70" rx="8" fill="#FFF" stroke="#3a4247" stroke-width="1.6"/>
  <text x="800" y="113" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1F22">Application</text>
  <text x="800" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1F22">Server</text>

  <text x="440" y="230" text-anchor="middle" font-size="11" fill="#565F62">Topologie « étoile de étoiles » : plusieurs passerelles peuvent recevoir le même message, dédupliqué par le network server.</text>
</svg>
