<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Topologie BLE : le smartphone en rôle Central se connecte point à point à plusieurs périphériques en rôle Peripheral ; un autre objet diffuse en Broadcaster sans connexion." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C6E74"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" fill="#FFFFFF"/>
  <text x="320" y="20" text-anchor="middle" font-family="ui-sans-serif, Arial" font-size="13" font-weight="600" fill="#1B1F22">Rôles BLE : connexion point à point et diffusion</text>

  <!-- central -->
  <circle cx="320" cy="150" r="42" fill="#FFF" stroke="#3a4247" stroke-width="1.6"/>
  <text x="320" y="146" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1B1F22">Smartphone</text>
  <text x="320" y="160" text-anchor="middle" font-size="10" fill="#565F62">(Central / GATT Client)</text>

  <!-- peripherals -->
  <g>
    <circle cx="130" cy="70" r="34" fill="#EDEEE9" stroke="#3a4247"/>
    <text x="130" y="66" text-anchor="middle" font-size="10.5" fill="#1B1F22">Périphérique</text>
    <text x="130" y="79" text-anchor="middle" font-size="9.5" fill="#565F62">(Peripheral)</text>

    <circle cx="130" cy="230" r="34" fill="#EDEEE9" stroke="#3a4247"/>
    <text x="130" y="226" text-anchor="middle" font-size="10.5" fill="#1B1F22">Périphérique</text>
    <text x="130" y="239" text-anchor="middle" font-size="9.5" fill="#565F62">(Peripheral)</text>
  </g>

  <line x1="160" y1="90" x2="285" y2="130" stroke="#2C6E74" stroke-width="1.8" marker-end="url(#arrow3)" marker-start="url(#arrow3)"/>
  <line x1="160" y1="210" x2="285" y2="170" stroke="#2C6E74" stroke-width="1.8" marker-end="url(#arrow3)" marker-start="url(#arrow3)"/>
  <text x="205" y="105" font-size="10" fill="#2C6E74">GATT</text>
  <text x="205" y="205" font-size="10" fill="#2C6E74">GATT</text>

  <!-- broadcaster (no connection) -->
  <circle cx="520" cy="150" r="34" fill="#EDEEE9" stroke="#3a4247" stroke-dasharray="3 3"/>
  <text x="520" y="146" text-anchor="middle" font-size="10.5" fill="#1B1F22">Balise</text>
  <text x="520" y="159" text-anchor="middle" font-size="9.5" fill="#565F62">(Broadcaster)</text>
  <path d="M486,150 Q450,150 362,150" stroke="#565F62" stroke-width="1.4" stroke-dasharray="2 3" fill="none" marker-end="url(#arrow3)"/>
  <text x="440" y="140" text-anchor="middle" font-size="10" fill="#565F62">advertising (non connecté)</text>
</svg>
