<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modulation LoRa par chirp spread spectrum : la fréquence d'un symbole balaie linéairement toute la bande passante BW pendant une durée Ts, puis recommence." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4247"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8672B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="270" fill="#FFFFFF"/>

  <!-- title -->
  <text x="320" y="24" text-anchor="middle" font-family="ui-sans-serif, Arial" font-size="14" font-weight="600" fill="#1B1F22">Chirp spread spectrum — 3 symboles LoRa consécutifs</text>

  <!-- axes -->
  <line x1="60" y1="210" x2="600" y2="210" stroke="#3a4247" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <line x1="60" y1="210" x2="60" y2="40" stroke="#3a4247" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <text x="608" y="214" font-family="ui-sans-serif, Arial" font-size="13" fill="#3a4247">Temps</text>
  <text x="40" y="38" text-anchor="middle" font-family="ui-sans-serif, Arial" font-size="13" fill="#3a4247">f</text>

  <!-- fmin / fmax dashed guides -->
  <line x1="60" y1="195" x2="530" y2="195" stroke="#c7cdd1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="60" y1="50" x2="530" y2="50" stroke="#c7cdd1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="55" y="199" text-anchor="end" font-family="ui-sans-serif, Arial" font-size="11" fill="#565F62">f_min</text>
  <text x="55" y="54" text-anchor="end" font-family="ui-sans-serif, Arial" font-size="11" fill="#565F62">f_max</text>

  <!-- symbol boundary guides -->
  <line x1="220" y1="50" x2="220" y2="210" stroke="#dfe3e5" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="380" y1="50" x2="380" y2="210" stroke="#dfe3e5" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- chirps (up-chirp, instant wrap) -->
  <path d="M70,195 L220,50" stroke="#2C6E74" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M220,195 L370,50" stroke="#2C6E74" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M380,195 L530,50" stroke="#2C6E74" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- wrap connectors -->
  <line x1="220" y1="50" x2="220" y2="195" stroke="#9fb3b6" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="380" y1="50" x2="380" y2="195" stroke="#9fb3b6" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- BW annotation -->
  <line x1="34" y1="50" x2="34" y2="195" stroke="#E8672B" stroke-width="1.5" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <text x="24" y="126" text-anchor="middle" font-family="ui-sans-serif, Arial" font-size="12" fill="#E8672B" transform="rotate(-90 24 126)">BW</text>

  <!-- Ts annotation -->
  <line x1="70" y1="232" x2="220" y2="232" stroke="#E8672B" stroke-width="1.5" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <text x="145" y="250" text-anchor="middle" font-family="ui-sans-serif, Arial" font-size="12" fill="#E8672B">Ts (durée symbole)</text>
</svg>
