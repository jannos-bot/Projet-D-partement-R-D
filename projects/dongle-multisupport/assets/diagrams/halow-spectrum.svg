<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wi-Fi HaLow découpe la bande sous 1 GHz en canaux de largeur variable : 1, 2, 4, 8 ou 16 MHz, contre 20 à 160 MHz pour le Wi-Fi classique." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="210" fill="#FFFFFF"/>
  <text x="380" y="20" text-anchor="middle" font-family="ui-sans-serif, Arial" font-size="13" font-weight="600" fill="#1B1F22">Bande sous-1 GHz — largeurs de canal Wi-Fi HaLow (802.11ah)</text>

  <!-- baseline -->
  <line x1="60" y1="170" x2="700" y2="170" stroke="#3a4247" stroke-width="1.2"/>

  <!-- channel width bars, increasing width, same height baseline -->
  <g>
    <rect x="60"  y="150" width="20"  height="20" fill="#cfe4e2" stroke="#2C6E74"/>
    <text x="70" y="145" text-anchor="middle" font-size="10.5" fill="#565F62">1 MHz</text>

    <rect x="100" y="140" width="40"  height="30" fill="#cfe4e2" stroke="#2C6E74"/>
    <text x="120" y="132" text-anchor="middle" font-size="10.5" fill="#565F62">2 MHz</text>

    <rect x="160" y="125" width="80"  height="45" fill="#cfe4e2" stroke="#2C6E74"/>
    <text x="200" y="117" text-anchor="middle" font-size="10.5" fill="#565F62">4 MHz</text>

    <rect x="260" y="105" width="160" height="65" fill="#cfe4e2" stroke="#2C6E74"/>
    <text x="340" y="97" text-anchor="middle" font-size="10.5" fill="#565F62">8 MHz</text>

    <rect x="440" y="80"  width="240" height="90" fill="#cfe4e2" stroke="#2C6E74"/>
    <text x="560" y="72" text-anchor="middle" font-size="10.5" fill="#565F62">16 MHz</text>
  </g>

  <text x="380" y="196" text-anchor="middle" font-size="11" fill="#565F62">À titre de comparaison, le Wi-Fi classique (2,4 / 5 GHz) utilise des canaux de 20 à 160 MHz.</text>
</svg>
