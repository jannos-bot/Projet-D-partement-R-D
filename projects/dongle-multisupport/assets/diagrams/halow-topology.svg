<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un point d'accès Wi-Fi HaLow couvre une zone étendue et relie de nombreuses stations directement à un cœur de réseau IP, sans passerelle applicative intermédiaire." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4247"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="300" fill="#FFFFFF"/>
  <text x="350" y="20" text-anchor="middle" font-family="ui-sans-serif, Arial" font-size="13" font-weight="600" fill="#1B1F22">Point d'accès étendu Wi-Fi HaLow — jusqu'à ~1-2 km, natif IP</text>

  <!-- coverage circle -->
  <circle cx="230" cy="165" r="130" fill="#cfe4e2" opacity="0.35" stroke="#2C6E74" stroke-dasharray="4 4"/>

  <!-- access point -->
  <rect x="200" y="140" width="60" height="50" rx="6" fill="#FFF" stroke="#3a4247" stroke-width="1.6"/>
  <text x="230" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#1B1F22">AP</text>
  <text x="230" y="180" text-anchor="middle" font-size="9" fill="#565F62">HaLow</text>

  <!-- stations around -->
  <g fill="#EDEEE9" stroke="#3a4247">
    <circle cx="120" cy="90"  r="16"/>
    <circle cx="110" cy="200" r="16"/>
    <circle cx="150" cy="260" r="16"/>
    <circle cx="300" cy="250" r="16"/>
    <circle cx="330" cy="110" r="16"/>
    <circle cx="270" cy="70"  r="16"/>
  </g>
  <g stroke="#2C6E74" stroke-width="1.2" stroke-dasharray="2 2">
    <line x1="200" y1="155" x2="132" y2="98"/>
    <line x1="200" y1="175" x2="123" y2="197"/>
    <line x1="205" y1="188" x2="158" y2="253"/>
    <line x1="255" y1="188" x2="294" y2="245"/>
    <line x1="258" y1="160" x2="322" y2="115"/>
    <line x1="240" y1="140" x2="274" y2="82"/>
  </g>
  <text x="230" y="308" text-anchor="middle" font-size="10.5" fill="#565F62">jusqu'à 8191 stations par point d'accès</text>

  <!-- AP to IP core -->
  <line x1="260" y1="165" x2="470" y2="165" stroke="#3a4247" stroke-width="1.8" marker-end="url(#arrow4)"/>
  <text x="365" y="150" text-anchor="middle" font-size="10.5" fill="#565F62">IP natif</text>

  <!-- IP core -->
  <rect x="475" y="135" width="160" height="60" rx="8" fill="#FFF" stroke="#3a4247" stroke-width="1.6"/>
  <text x="555" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1B1F22">Cœur réseau IP</text>
  <text x="555" y="176" text-anchor="middle" font-size="10" fill="#565F62">(voix, messagerie, Internet)</text>
</svg>
